<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="The page you requested could not be found.">
  <title>Page not found — Decentrify</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
  <style>
    :root { --ink:#071222; --blue:#1170E7; --cream:#f6f3e9; --muted:rgba(246,243,233,.65); --line:rgba(246,243,233,.18); --sans:"DM Sans",Arial,sans-serif; --mono:"DM Mono",monospace; }
    * { box-sizing:border-box; }
    html { background:var(--ink); }
    body { min-height:100svh; margin:0; display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; background:radial-gradient(ellipse 70% 55% at 78% 46%,#0c2b5c 0%,var(--ink) 65%); color:var(--cream); font-family:var(--sans); }
    .grain { position:fixed; inset:0; pointer-events:none; opacity:.07; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E"); }
    header, footer { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:26px clamp(24px,5vw,76px); }
    .brand { display:inline-flex; align-items:center; gap:10px; color:var(--cream); font-size:14px; font-weight:700; letter-spacing:-.03em; text-decoration:none; }
    .brand img { width:22px; height:22px; }
    .back { color:var(--cream); font:11px var(--mono); letter-spacing:.06em; text-decoration:none; text-transform:uppercase; }
    .back:hover, .back:focus-visible { color:var(--blue); }
    main { position:relative; z-index:1; display:grid; place-items:center; padding:70px clamp(24px,8vw,150px); }
    .content { width:min(100%,920px); }
    .eyebrow { margin:0 0 22px; color:var(--blue); font:11px var(--mono); letter-spacing:.09em; text-transform:uppercase; }
    h1 { max-width:800px; margin:0; font-size:clamp(54px,9.2vw,142px); font-weight:500; letter-spacing:-.075em; line-height:.88; }
    h1 em { color:var(--blue); font-style:normal; }
    p { max-width:460px; margin:30px 0 0; color:var(--muted); font-size:clamp(16px,1.5vw,19px); line-height:1.5; }
    .button { display:inline-flex; align-items:center; gap:20px; margin-top:34px; padding:14px 18px; border:1px solid var(--blue); background:var(--blue); color:#fff; font:600 11px var(--mono); letter-spacing:.06em; text-decoration:none; text-transform:uppercase; transition:background .2s,color .2s; }
    .button:hover, .button:focus-visible { background:transparent; color:var(--cream); }
    footer { color:var(--muted); font:10px var(--mono); letter-spacing:.04em; }
    footer span:last-child { color:var(--blue); }
    @media (max-width:600px) { body { overflow:auto; } header, footer { padding:22px 24px; } main { align-items:start; padding-top:20vh; } h1 { font-size:clamp(52px,16vw,74px); } footer span:last-child { display:none; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header>
    <a class="brand" href="index.html" aria-label="Decentrify home"><img src="logo.svg" alt=""><span>Decentrify</span></a>
    <a class="back" href="index.html">Back home ↖</a>
  </header>
  <main id="main">
    <section class="content" aria-labelledby="not-found-heading">
      <p class="eyebrow">Error 404 / Lost signal</p>
      <h1 id="not-found-heading">This page<br>isn’t <em>here.</em></h1>
      <p>The address may have changed, or the link may be out of date. Let’s get you back to where the work is happening.</p>
      <a class="button" href="index.html">Return home <span>↖</span></a>
    </section>
  </main>
  <footer><span>© 2026 Decentrify Inc.</span><span>Build better. Move faster. Scale smarter.</span></footer>
</body>
</html>
